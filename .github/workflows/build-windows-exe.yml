name: Build Windows executable

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "manifest.json"
      - "library/**"
      - ".github/workflows/build-windows-exe.yml"
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build standalone executable
        run: |
          pyinstaller --onefile --windowed --name PCDMIS_Macro_Library `
            --add-data "manifest.json;." `
            --add-data "library;library" `
            app.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCDMIS_Macro_Library-windows-exe
          path: dist/PCDMIS_Macro_Library.exe
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PCDMIS_Macro_Library.exe
